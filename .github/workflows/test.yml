name: Test suite

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby-version }} / Rails ${{ matrix.rails-version }} / Devise ${{ matrix.devise-version }} / ${{ matrix.orm }} / Mongoid ${{ matrix.mongoid-version || '9.1' }} / Argon2 ${{ matrix.argon2-version || '2.3' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.1', '3.2', '3.3', '3.4', '4.0']
        # Patch floors prevent Bundler from selecting an older Rails release
        # to keep newer transitive dependencies (for example Minitest 6).
        rails-version: ['~> 7.2.4', '~> 8.0.5', '~> 8.1.4']
        devise-version: ['~> 4.9.0', '~> 5.0.0']
        orm: [active_record, mongoid]
        argon2-version: ['~> 2.3.0']
        mongoid-version: ['~> 9.1.0']
        exclude:
          # Rails 8 requires Ruby 3.2 or later.
          - rails-version: '~> 8.1.4'
            ruby-version: '3.1'
          - rails-version: '~> 8.0.5'
            ruby-version: '3.1'
        include:
          # Keep coverage for older Argon2 and Mongoid releases without
          # multiplying the entire matrix by these dependency versions.
          - ruby-version: '3.4'
            rails-version: '~> 8.1.4'
            devise-version: '~> 5.0.0'
            orm: active_record
            argon2-version: '~> 2.2.0'
          - ruby-version: '3.4'
            rails-version: '~> 8.1.4'
            devise-version: '~> 5.0.0'
            orm: mongoid
            argon2-version: '~> 2.2.0'
          # Mongoid 8.1 does not support Rails 8.1.
          - ruby-version: '3.4'
            rails-version: '~> 8.0.5'
            devise-version: '~> 4.9.0'
            orm: mongoid
            mongoid-version: '~> 8.1.4'
          - ruby-version: '3.4'
            rails-version: '~> 8.0.5'
            devise-version: '~> 5.0.0'
            orm: mongoid
            mongoid-version: '~> 8.1.4'
          # Track unreleased Devise changes on the newest Ruby/Rails stack.
          - ruby-version: '4.0'
            rails-version: '~> 8.1.4'
            devise-version: main
            orm: active_record
          - ruby-version: '4.0'
            rails-version: '~> 8.1.4'
            devise-version: main
            orm: mongoid
    env:
      RAILS_ENV: test
      RAILS_VERSION: ${{ matrix.rails-version }}
      MONGOID_VERSION: ${{ matrix.mongoid-version || '~> 9.1.0' }}
      ORM: ${{ matrix.orm }}
      ARGON2_VERSION: ${{ matrix.argon2-version || '~> 2.3.0' }}
      DEVISE_VERSION: ${{ matrix.devise-version }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - uses: supercharge/mongodb-github-action@1.12.1
      if: ${{ matrix.orm == 'mongoid' }}
      with:
        mongodb-version: '8.0'
    - name: Setup rails test environment
      if: ${{ matrix.orm == 'active_record' }}
      working-directory: spec/rails_app
      run: bundle exec rails db:prepare
    - name: Show dependency versions
      run: bundle list
    - name: Run tests
      run: bundle exec rspec --order random
